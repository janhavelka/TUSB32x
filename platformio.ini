; Complete examples, each with exactly one setup/loop and the same shared CLI.
[platformio]
src_dir = .
default_envs = esp32s2dev, esp32s3dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
extra_scripts = pre:scripts/arduino_identity.py
monitor_speed = 115200
monitor_rts = 0
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++2a -std=gnu++2b
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror=return-type
  -DCONFIG_DISABLE_HAL_LOCKS=1
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
build_src_filter =
  -<*>
  +<src/TUSB32x.cpp>
  +<src/TUSB32xProtocol.cpp>
  +<src/TUSB32xCodecs.cpp>
  +<src/TUSB32xOperations.cpp>
  +<src/TUSB32xDiagnostics.cpp>
  +<examples/common/Tusb32xCli.cpp>
  +<examples/common/Tusb32xCliOutput.cpp>
  +<examples/common/ExampleOwner.cpp>
  +<examples/arduino/Tusb32xWire.cpp>
  +<examples/arduino/ExampleApp.cpp>

[env:esp32s2dev]
board = esp32-s2-saola-1
monitor_dtr = 1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=0
build_src_filter = ${env.build_src_filter} +<examples/01_basic_bringup_cli/main.cpp>

[env:esp32s3dev]
board = esp32-s3-devkitc-1
monitor_dtr = 0
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1
build_src_filter = ${env.build_src_filter} +<examples/01_basic_bringup_cli/main.cpp>

[env:esp32s2_owner_service]
board = esp32-s2-saola-1
monitor_dtr = 1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=0
build_src_filter = ${env.build_src_filter} +<examples/02_owner_service/main.cpp>

[env:esp32s3_owner_service]
board = esp32-s3-devkitc-1
monitor_dtr = 0
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1
build_src_filter = ${env.build_src_filter} +<examples/02_owner_service/main.cpp>
