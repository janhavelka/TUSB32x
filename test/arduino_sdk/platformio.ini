; Link the actual Arduino adapter and core. This is not a hardware example.
[platformio]
src_dir = ../..
default_envs = arduino_s2, arduino_s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++2a -std=gnu++2b
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror=return-type
  -DCONFIG_DISABLE_HAL_LOCKS=1
  -DCORE_DEBUG_LEVEL=0
  -I../../include
  -I../../examples/arduino
build_src_filter =
  -<*>
  +<src/TUSB32x.cpp>
  +<src/TUSB32xProtocol.cpp>
  +<src/TUSB32xCodecs.cpp>
  +<src/TUSB32xOperations.cpp>
  +<src/TUSB32xDiagnostics.cpp>
  +<examples/arduino/Tusb32xWire.cpp>
  +<test/arduino_sdk/main.cpp>

[env:arduino_s2]
board = esp32-s2-saola-1

[env:arduino_s3]
board = esp32-s3-devkitc-1
