version: "0.1.0-dev.1"
description: "Portable TUSB32x owner lifecycle, profile application/verification, read-only reconciliation, reset, original-device recovery, complete port observations, bounded interrupt service, raw diagnostics and passive health."
license: "MIT"
maintainers:
  - "Jan Havelka <info@thymos.cz>"
repository: "https://github.com/janhavelka/TUSB32x.git"
dependencies:
  idf: ">=5.3.0"

# IDF includes override excludes. Re-include only consumer files after excluding all.
files:
  exclude:
    - "**/*"
  include:
    - "include/TUSB32x/*.h"
    - "src/TUSB32x.cpp"
    - "src/TUSB32xProtocol.cpp"
    - "src/TUSB32xProtocol.h"
    - "src/TUSB32xCodecs.cpp"
    - "src/TUSB32xCodecs.h"
    - "CMakeLists.txt"
    - "src/TUSB32xOperations.cpp"
    - "src/TUSB32xOwnerTime.h"
    - "src/TUSB32xDiagnostics.cpp"
    - "library.json"
    - "idf_component.yml"
    - "LICENSE"
    - "README.md"
    - "CHANGELOG.md"
    - "Doxyfile"
    - "docs/README.md"
    - "docs/api-contracts.md"
    - "docs/architecture.md"
    - "docs/transport.md"
    - "docs/arduino-transport.md"
    - "docs/idf-transport.md"
    - "docs/integration.md"
    - "examples/esp_idf/Tusb32xIdf.h"
    - "examples/esp_idf/Tusb32xIdf.cpp"
    - "docs/diagnostics.md"
    - "docs/CLI.md"
    - "docs/register-map.md"
    - "docs/register-vectors.md"
    - "docs/variant-matrix.md"
    - "docs/device-behavior.md"
    - "docs/feature-coverage.md"
    - "docs/development.md"
    - "examples/README.md"
    - "examples/arduino/Tusb32xWire.h"
    - "examples/arduino/Tusb32xWire.cpp"
    - "examples/common/Tusb32xCli.h"
    - "examples/common/Tusb32xCli.cpp"
    - "examples/common/Tusb32xCliOutput.cpp"
