; Real portable consumer only. No firmware targets or automatic version mutation.
[platformio]
src_dir = .
default_envs = native

[env:native]
platform = platformio/native@1.2.1
lib_deps = symlink://../../..
build_src_filter = +<main.cpp> +<profile.cpp>
build_unflags = -std=gnu++11 -std=c++11
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Werror
